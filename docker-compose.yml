services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pressplay
      POSTGRES_PASSWORD: pressplay
      POSTGRES_DB: pressplay
    volumes:
      - pressplay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pressplay -d pressplay"]
      interval: 5s
      timeout: 5s
      retries: 5

  newsroom:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./secrets/gcp-sa.json:/secrets/gcp.json:ro
    env_file:
      - .env
    environment:
      DATA_DIR: data
      DATABASE_URL: postgresql+asyncpg://pressplay:pressplay@db:5432/pressplay
      SESSION_SECRET: ${SESSION_SECRET:-dev-change-me-set-in-env-for-production}
      DEBUG: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp.json
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-${VERTEX_PROJECT}}
      GCP_LOCATION: ${GCP_LOCATION:-${VERTEX_LOCATION:-us-central1}}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pressplay_pg:
