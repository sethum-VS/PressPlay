<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PressPlay — The Multimodal Newsroom{% endblock %}</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,typography"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary-container": "#d24200", "surface-strong": "#e6e5e0", "inverse-on-surface": "#ffede8",
            "secondary": "#605e56", "on-primary-fixed-variant": "#832600", "success": "#1f8a65",
            "on-primary": "#ffffff", "primary-fixed-dim": "#ffb59d", "on-secondary-fixed": "#1d1c15",
            "timeline-edit": "#c0a8dd", "timeline-read": "#9fbbe0", "secondary-container": "#e3dfd4",
            "hairline-strong": "#cfcdc4", "timeline-done": "#c08532", "on-secondary": "#ffffff",
            "on-secondary-container": "#65635a", "body": "#5a5852", "surface-variant": "#fadcd3",
            "surface-card": "#ffffff", "timeline-grep": "#9fc9a2", "on-background": "#281813",
            "background": "#fff8f6", "ink": "#26251e", "muted": "#807d72", "on-surface": "#281813",
            "hairline": "#e6e5e0", "on-surface-variant": "#5c4038", "muted-soft": "#a09c92",
            "error": "#cf2d56", "error-container": "#ffede8", "surface": "#fff8f6", "primary-fixed": "#ffdbd0",
            "surface-tint": "#ac3400", "timeline-thinking": "#dfa88f", "primary-active": "#d04200",
            "canvas": "#f7f7f4", "surface-container-low": "#fff1ed", "tertiary-container": "#0074db",
            "outline": "#907066", "tertiary": "#005baf", "primary": "#a83300",
            "on-primary-container": "#fffbff", "outline-variant": "#e5beb2"
          },
          borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
          spacing: { lg: "24px", xxl: "48px", section: "80px", xs: "8px", md: "20px", xxs: "4px", xl: "32px", sm: "12px", base: "16px" },
          fontFamily: {
            caption: ["Inter"], "body-md": ["Inter"], code: ["JetBrains Mono"],
            button: ["Inter"], "title-md": ["Inter"], "title-sm": ["Inter"],
            "display-sm": ["Inter"], "display-lg": ["Inter"], "body-sm": ["Inter"],
            "display-md": ["Inter"], "body-tracked": ["Inter"], "nav-link": ["Inter"],
            "caption-uppercase": ["Inter"]
          },
          fontSize: {
            caption: ["13px", { lineHeight: "1.4", fontWeight: "400" }],
            "body-md": ["16px", { lineHeight: "1.5", fontWeight: "400" }],
            code: ["13px", { lineHeight: "1.5", fontWeight: "400" }],
            "body-tracked": ["16px", { lineHeight: "1.5", letterSpacing: "0.08px", fontWeight: "400" }],
            button: ["14px", { lineHeight: "1.0", fontWeight: "500" }],
            "title-md": ["18px", { lineHeight: "1.4", fontWeight: "600" }],
            "title-sm": ["16px", { lineHeight: "1.4", fontWeight: "600" }],
            "display-sm": ["22px", { lineHeight: "1.3", letterSpacing: "-0.11px", fontWeight: "400" }],
            "display-lg": ["36px", { lineHeight: "1.2", letterSpacing: "-0.72px", fontWeight: "400" }],
            "body-sm": ["14px", { lineHeight: "1.5", fontWeight: "400" }],
            "caption-uppercase": ["11px", { lineHeight: "1.4", letterSpacing: "0.88px", fontWeight: "600" }],
            "nav-link": ["14px", { lineHeight: "1.4", fontWeight: "500" }],
            "display-md": ["26px", { lineHeight: "1.25", letterSpacing: "-0.325px", fontWeight: "400" }]
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #f7f7f4; color: #26251e; }
    .htmx-indicator { display: none; opacity: 0; transition: opacity 200ms ease-in; }
    .htmx-request .htmx-indicator { display: flex; opacity: 1; }
    .htmx-request.htmx-indicator { display: flex; opacity: 1; }
    .pulse-ring { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(1.05); } }
    .stage-active { opacity: 1 !important; }
    .stage-pending { opacity: 0.35; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col font-body-md text-body-md antialiased selection:bg-surface-tint selection:text-white">
  <nav class="w-full h-[64px] bg-canvas border-b border-hairline flex justify-between items-center px-lg max-w-full mx-auto z-50 sticky top-0">
    <div class="flex items-center w-1/4">
      <a href="/" class="font-display-sm text-display-sm text-ink tracking-tight">PressPlay</a>
    </div>
    <div class="hidden md:flex gap-lg justify-center flex-1">
      <a class="font-nav-link text-nav-link text-primary transition-colors" href="/">Dashboard</a>
      <span class="font-nav-link text-nav-link text-muted-soft">Sources</span>
      <span class="font-nav-link text-nav-link text-muted-soft">Analytics</span>
    </div>
    <div class="flex items-center gap-md justify-end w-1/4">
      <span class="font-caption text-caption text-muted hidden md:block">v1 scaffold</span>
    </div>
  </nav>

  <main class="flex-grow w-full max-w-[1200px] mx-auto px-lg py-section flex flex-col gap-section">
    {% block content %}{% endblock %}
  </main>

  <footer class="w-full py-[64px] px-[48px] border-t border-hairline bg-canvas mt-auto">
    <div class="grid grid-cols-1 md:grid-cols-5 gap-lg max-w-[1200px] mx-auto">
      <div class="md:col-span-2 flex flex-col gap-xs">
        <span class="font-title-sm text-title-sm text-ink">PressPlay</span>
        <p class="font-body-sm text-body-sm text-body">© 2026 PressPlay. Editorial Precision Powered by AI.</p>
      </div>
      <div class="flex flex-col gap-xs">
        <h4 class="font-caption-uppercase text-caption-uppercase text-ink mb-2">Legal</h4>
        <span class="font-body-sm text-body-sm text-muted">Privacy · Terms</span>
      </div>
      <div class="flex flex-col gap-xs">
        <h4 class="font-caption-uppercase text-caption-uppercase text-ink mb-2">Resources</h4>
        <span class="font-body-sm text-body-sm text-muted">API · Changelog</span>
      </div>
      <div class="flex flex-col gap-xs">
        <h4 class="font-caption-uppercase text-caption-uppercase text-ink mb-2">Support</h4>
        <span class="font-body-sm text-body-sm text-muted">Help Center</span>
      </div>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
